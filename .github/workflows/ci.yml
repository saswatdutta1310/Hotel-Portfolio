name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Check for frontend app
        id: has_app
        run: |
          if [ -f package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
        working-directory: .
        shell: bash
      - uses: pnpm/action-setup@v4
        if: steps.has_app.outputs.present == 'true'
        with:
          version: 10
      - uses: actions/setup-node@v4
        if: steps.has_app.outputs.present == 'true'
        with:
          node-version: 26
      - run: pnpm install
        if: steps.has_app.outputs.present == 'true'
      - run: pnpm lint
        if: steps.has_app.outputs.present == 'true'
      - run: pnpm typecheck
        if: steps.has_app.outputs.present == 'true'
      - run: pnpm test
        if: steps.has_app.outputs.present == 'true'
      - run: pnpm build
        if: steps.has_app.outputs.present == 'true'
        env:
          USE_MOCK: "true"

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Check for backend app
        id: has_app
        run: |
          if [ -f package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
        working-directory: .
        shell: bash
      - uses: pnpm/action-setup@v4
        if: steps.has_app.outputs.present == 'true'
        with:
          version: 10
      - uses: actions/setup-node@v4
        if: steps.has_app.outputs.present == 'true'
        with:
          node-version: 26
      - run: pnpm install
        if: steps.has_app.outputs.present == 'true'
      - run: pnpm lint
        if: steps.has_app.outputs.present == 'true'
      - run: pnpm typecheck
        if: steps.has_app.outputs.present == 'true'
      - run: pnpm test
        if: steps.has_app.outputs.present == 'true'
      - run: pnpm build
        if: steps.has_app.outputs.present == 'true'
